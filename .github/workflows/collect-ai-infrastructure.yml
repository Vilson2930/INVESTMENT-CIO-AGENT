name: Collect AI Infrastructure

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  collect-ai-infrastructure:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Investment CIO Agent
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare directories
        run: |
          mkdir -p inputs/ai_infrastructure
          mkdir -p outputs
          mkdir -p temp_ai_infrastructure_artifact

      - name: Find latest AI Infrastructure artifact
        id: find_artifact
        env:
          GH_TOKEN: ${{ secrets.CIO_GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          owner = "Vilson2930"
          repo = "AI_INFRASTRUCTURE_SCANNER"
          artifact_name = "ai-infrastructure-agent-output"

          token = os.environ["GH_TOKEN"]

          url = (
              f"https://api.github.com/repos/"
              f"{owner}/{repo}/actions/artifacts"
              f"?per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          artifacts = [
              artifact
              for artifact in data.get("artifacts", [])
              if (
                  artifact.get("name") == artifact_name
                  and not artifact.get("expired", False)
              )
          ]

          if not artifacts:
              raise RuntimeError(
                  "Nenhum artifact válido encontrado com o nome "
                  f"'{artifact_name}' em {owner}/{repo}."
              )

          artifacts.sort(
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )

          artifact = artifacts[0]

          artifact_id = artifact["id"]

          print(
              "Artifact encontrado:"
          )
          print(
              f"  nome: {artifact.get('name')}"
          )
          print(
              f"  id: {artifact_id}"
          )
          print(
              f"  criado em: {artifact.get('created_at')}"
          )

          github_output = os.environ["GITHUB_OUTPUT"]

          with open(
              github_output,
              "a",
              encoding="utf-8",
          ) as file:
              file.write(
                  f"artifact_id={artifact_id}\n"
              )
          PY

      - name: Download AI Infrastructure artifact
        env:
          GH_TOKEN: ${{ secrets.CIO_GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.find_artifact.outputs.artifact_id }}
        run: |
          python - <<'PY'
          import os
          import urllib.request

          owner = "Vilson2930"
          repo = "AI_INFRASTRUCTURE_SCANNER"

          artifact_id = os.environ["ARTIFACT_ID"]
          token = os.environ["GH_TOKEN"]

          url = (
              f"https://api.github.com/repos/"
              f"{owner}/{repo}/actions/artifacts/"
              f"{artifact_id}/zip"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              content = response.read()

          output_file = (
              "temp_ai_infrastructure_artifact/"
              "artifact.zip"
          )

          with open(output_file, "wb") as file:
              file.write(content)

          print(
              f"Artifact baixado: {output_file}"
          )
          PY

      - name: Extract AI Infrastructure artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          zip_path = Path(
              "temp_ai_infrastructure_artifact/"
              "artifact.zip"
          )

          extract_dir = Path(
              "temp_ai_infrastructure_artifact/"
              "extracted"
          )

          extract_dir.mkdir(
              parents=True,
              exist_ok=True,
          )

          with ZipFile(zip_path, "r") as zip_file:
              zip_file.extractall(extract_dir)

          print(
              "Artifact extraído."
          )

          for path in extract_dir.rglob("*"):
              if path.is_file():
                  print(path)
          PY

      - name: Locate raw AI Infrastructure agent output
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          base = Path(
              "temp_ai_infrastructure_artifact/"
              "extracted"
          )

          matches = list(
              base.rglob(
                  "agent_output_raw.json"
              )
          )

          if not matches:
              raise RuntimeError(
                  "agent_output_raw.json não encontrado "
                  "dentro do artifact do "
                  "AI Infrastructure Scanner."
              )

          if len(matches) > 1:
              print(
                  "Mais de um agent_output_raw.json "
                  "foi encontrado."
              )
              print(
                  "Será utilizado o primeiro:"
              )

          source = matches[0]

          destination = Path(
              "inputs/ai_infrastructure/"
              "agent_output_raw.json"
          )

          shutil.copy2(
              source,
              destination,
          )

          print(
              f"Arquivo localizado: {source}"
          )

          print(
              f"Copiado para: {destination}"
          )
          PY

      - name: Process real AI Infrastructure output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from agents.collector import (
              collect_file,
          )

          input_file = Path(
              "inputs/ai_infrastructure/"
              "agent_output_raw.json"
          )

          output_file = Path(
              "outputs/"
              "ai_infrastructure_agent_output.json"
          )

          result = collect_file(
              input_file
          )

          output_file.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          with open(
              output_file,
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2,
                  allow_nan=False,
              )

          print()
          print("=" * 70)
          print(
              "INVESTMENT CIO AGENT"
          )
          print(
              "COLETA REAL — AI INFRASTRUCTURE"
          )
          print("=" * 70)

          print(
              f"Sistema: {result['system_name']}"
          )

          print(
              f"Status: {result['status']}"
          )

          print(
              "Sinal universal: "
              f"{result['decision']['signal']}"
          )

          print(
              "Oportunidades preservadas: "
              f"{len(result.get('opportunities', []))}"
          )

          print(
              "Métricas:"
          )

          print(
              json.dumps(
                  result.get("metrics", {}),
                  ensure_ascii=False,
                  indent=2,
              )
          )

          print(
              f"Output universal criado: {output_file}"
          )

          print("=" * 70)
          PY

      - name: Validate universal AI Infrastructure output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from agents.validator import (
              validate_agent_output,
          )

          output_file = Path(
              "outputs/"
              "ai_infrastructure_agent_output.json"
          )

          with open(
              output_file,
              "r",
              encoding="utf-8",
          ) as file:
              payload = json.load(file)

          validation = validate_agent_output(
              payload
          )

          if not validation["valid"]:
              print(
                  json.dumps(
                      validation,
                      ensure_ascii=False,
                      indent=2,
                  )
              )

              raise RuntimeError(
                  "Output universal do "
                  "AI Infrastructure Scanner "
                  "não passou pelo schema."
              )

          if (
              payload.get("system_id")
              != "ai_infrastructure"
          ):
              raise RuntimeError(
                  "system_id inesperado: "
                  f"{payload.get('system_id')}"
              )

          print(
              "Output universal do "
              "AI Infrastructure Scanner: VÁLIDO"
          )
          PY

      - name: Upload Investment CIO AI Infrastructure output
        uses: actions/upload-artifact@v4
        with:
          name: investment-cio-ai-infrastructure-output
          path: outputs/ai_infrastructure_agent_output.json
          if-no-files-found: error
          retention-days: 30
