name: Test Investment CIO Agent

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test infrastructure
        run: |
          python -m tests.test_infrastructure

      - name: Test SP500 Cycle Adapter
        run: |
          python -m tests.test_sp500_adapter

      - name: Test Collector
        run: |
          python -m tests.test_collector

      - name: Test COPIAULTIMOROB Adapter
        run: |
          python -m tests.test_copiaultimorob_adapter

      - name: Test Synthesis Agent
        run: |
          python -m tests.test_synthesis_agent
