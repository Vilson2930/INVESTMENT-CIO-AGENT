name: Collect Growth Opportunity

on:
  workflow_dispatch:

jobs:
  collect-growth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Investment CIO Agent
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find latest Growth artifact
        id: growth
        env:
          GH_TOKEN: ${{ secrets.CIO_GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = "Vilson2930/GROWTH-OPPORTUNITY-ENGINE"
          artifact_name = "growth-opportunity-agent-output"

          url = (
              f"https://api.github.com/repos/{repo}/"
              "actions/artifacts?per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          artifacts = [
              artifact
              for artifact in data.get("artifacts", [])
              if artifact.get("name") == artifact_name
              and not artifact.get("expired", False)
          ]

          if not artifacts:
              raise SystemExit(
                  "Nenhum artifact válido do Growth foi encontrado."
              )

          artifacts.sort(
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )

          artifact = artifacts[0]

          run_id = artifact["workflow_run"]["id"]

          print(f"Artifact encontrado: {artifact['name']}")
          print(f"Artifact ID: {artifact['id']}")
          print(f"Run ID: {run_id}")
          print(f"Created at: {artifact.get('created_at')}")

          github_output = os.environ["GITHUB_OUTPUT"]

          with open(
              github_output,
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"run_id={run_id}\n")
          PY

      - name: Download Growth artifact
        uses: actions/download-artifact@v5
        with:
          name: growth-opportunity-agent-output
          path: source-growth
          repository: Vilson2930/GROWTH-OPPORTUNITY-ENGINE
          run-id: ${{ steps.growth.outputs.run_id }}
          github-token: ${{ secrets.CIO_GITHUB_TOKEN }}

      - name: Locate Growth raw output
        id: raw
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          files = list(
              Path("source-growth").rglob(
                  "agent_output_raw.json"
              )
          )

          if len(files) != 1:
              raise SystemExit(
                  "Esperado exatamente 1 "
                  "agent_output_raw.json; "
                  f"encontrados: {len(files)}"
              )

          raw_file = files[0]

          print(
              f"Growth raw output encontrado: {raw_file}"
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"raw_file={raw_file.as_posix()}\n"
              )
          PY

      - name: Process Growth through CIO Collector
        env:
          RAW_FILE: ${{ steps.raw.outputs.raw_file }}
        run: |
          mkdir -p outputs

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from agents.collector import collect_file

          raw_file = os.environ["RAW_FILE"]

          output = collect_file(
              raw_file
          )

          output_file = Path(
              "outputs/growth_agent_output.json"
          )

          with open(
              output_file,
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2,
                  allow_nan=False,
              )

          print(
              "Growth processado pelo "
              "Investment CIO Collector."
          )

          print(
              f"System ID: {output.get('system_id')}"
          )

          print(
              f"Status: {output.get('status')}"
          )

          print(
              "Universal signal: "
              f"{output.get('decision', {}).get('signal')}"
          )

          print(
              "Opportunities: "
              f"{len(output.get('opportunities', []))}"
          )
          PY

      - name: Validate real Growth CIO output
        env:
          RAW_FILE: ${{ steps.raw.outputs.raw_file }}
        run: |
          python - <<'PY'
          import json
          import os

          from agents.validator import (
              validate_agent_output,
          )

          with open(
              os.environ["RAW_FILE"],
              "r",
              encoding="utf-8",
          ) as file:
              raw = json.load(file)

          with open(
              "outputs/growth_agent_output.json",
              "r",
              encoding="utf-8",
          ) as file:
              output = json.load(file)

          validation = validate_agent_output(
              output
          )

          assert validation["valid"], (
              validation["errors"]
          )

          assert (
              raw["source_system"]
              == "GROWTH_OPPORTUNITY_ENGINE"
          )

          assert output["system_id"] == "growth"

          assert (
              output["decision"]["signal"]
              == "OPPORTUNITY_SET_WITH_ENTRY_SIGNALS"
          )

          assert (
              output["decision"]["confidence"]
              is None
          )

          raw_strategy = raw.get(
              "strategy",
              []
          )

          opportunities = output.get(
              "opportunities",
              []
          )

          assert len(opportunities) == len(
              raw_strategy
          )

          raw_tickers = [
              row.get("ticker")
              for row in raw_strategy
          ]

          cio_tickers = [
              row.get("ticker")
              for row in opportunities
          ]

          assert cio_tickers == raw_tickers

          raw_signals = [
              row.get("signal")
              for row in raw_strategy
          ]

          cio_signals = [
              row.get("signal")
              for row in opportunities
          ]

          assert cio_signals == raw_signals

          raw_waiting = sum(
              1
              for signal in raw_signals
              if signal == "AGUARDAR"
          )

          cio_waiting = sum(
              1
              for signal in cio_signals
              if signal == "AGUARDAR"
          )

          assert cio_waiting == raw_waiting

          audit = output.get(
              "audit",
              {}
          )

          assert (
              audit.get("recalculates_signals")
              is False
          )

          assert (
              audit.get("recalculates_ranking")
              is False
          )

          assert (
              audit.get("executes_broker_orders")
              is False
          )

          print(
              "Growth Investment CIO output "
              "validado com sucesso."
          )

          print(
              f"System ID: {output['system_id']}"
          )

          print(
              f"Status: {output['status']}"
          )

          print(
              f"Opportunities: {len(opportunities)}"
          )

          print(
              f"AGUARDAR: {cio_waiting}"
          )

          print(
              "Ordem do motor preservada: SIM"
          )

          print(
              "Sinais do motor preservados: SIM"
          )

          print(
              "Recálculo pelo CIO: NÃO"
          )

          print(
              "Execução em corretora: NÃO"
          )
          PY

      - name: Upload Investment CIO Growth output
        uses: actions/upload-artifact@v4
        with:
          name: investment-cio-growth-output
          path: outputs/growth_agent_output.json
          if-no-files-found: error
