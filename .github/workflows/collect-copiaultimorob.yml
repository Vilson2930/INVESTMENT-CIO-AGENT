name: Collect COPIAULTIMOROB

on:
  workflow_dispatch:

jobs:
  collect-copiaultimorob:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Investment CIO Agent
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find latest COPIAULTIMOROB artifact
        id: find_artifact
        env:
          GH_TOKEN: ${{ secrets.CIO_GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = "Vilson2930/COPIAULTIMOROB"
          token = os.environ["GH_TOKEN"]

          url = (
              f"https://api.github.com/repos/{repo}/"
              "actions/artifacts?per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          artifacts = [
              artifact
              for artifact in data.get("artifacts", [])
              if not artifact.get("expired", False)
          ]

          if not artifacts:
              raise RuntimeError(
                  "Nenhum artifact válido encontrado "
                  "no COPIAULTIMOROB."
              )

          artifacts.sort(
              key=lambda item: item["created_at"],
              reverse=True,
          )

          artifact = artifacts[0]

          print("Artifact encontrado:")
          print("Nome:", artifact["name"])
          print("ID:", artifact["id"])
          print("Criado em:", artifact["created_at"])

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"artifact_id={artifact['id']}\n"
              )
              output.write(
                  f"artifact_name={artifact['name']}\n"
              )
          PY

      - name: Download COPIAULTIMOROB artifact
        env:
          GH_TOKEN: ${{ secrets.CIO_GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ steps.find_artifact.outputs.artifact_id }}
        run: |
          mkdir -p collected/copiaultimorob

          curl -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Vilson2930/COPIAULTIMOROB/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o collected/copiaultimorob/artifact.zip

          unzip -o \
            collected/copiaultimorob/artifact.zip \
            -d collected/copiaultimorob/extracted

      - name: Locate COPIAULTIMOROB raw output
        id: locate_raw
        run: |
          RAW_FILE=$(find \
            collected/copiaultimorob/extracted \
            -type f \
            -name "agent_output_raw.json" \
            | head -n 1)

          if [ -z "$RAW_FILE" ]; then
            echo "agent_output_raw.json não encontrado."
            echo "Arquivos encontrados no artifact:"
            find collected/copiaultimorob/extracted -type f
            exit 1
          fi

          echo "Arquivo encontrado:"
          echo "$RAW_FILE"

          echo "raw_file=$RAW_FILE" >> "$GITHUB_OUTPUT"

      - name: Process COPIAULTIMOROB with CIO Collector
        env:
          RAW_FILE: ${{ steps.locate_raw.outputs.raw_file }}
        run: |
          mkdir -p outputs

          python - <<'PY'
          import json
          import os

          from agents.collector import collect_file
          from agents.validator import validate_agent_output

          raw_file = os.environ["RAW_FILE"]

          output = collect_file(raw_file)

          validation = validate_agent_output(output)

          if not validation["valid"]:
              raise RuntimeError(
                  f"Output universal inválido: "
                  f"{validation['errors']}"
              )

          output_file = (
              "outputs/"
              "copiaultimorob_agent_output.json"
          )

          with open(
              output_file,
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )

          print("=" * 70)
          print("INVESTMENT CIO AGENT")
          print("COLETA REAL — COPIAULTIMOROB")
          print("=" * 70)

          print("Sistema:")
          print(output["system_name"])

          print("Status:")
          print(output["status"])

          print("Sinal:")
          print(output["decision"]["signal"])

          print("Risco integrado:")
          print(output["risk"]["level"])

          print("Veredito:")
          print(
              output["metrics"].get(
                  "final_verdict"
              )
          )

          print("Output universal criado:")
          print(output_file)

          print("=" * 70)
          print(
              "COLETA REAL CONCLUÍDA COM SUCESSO"
          )
          print("=" * 70)
          PY

      - name: Upload Investment CIO output
        uses: actions/upload-artifact@v4
        with:
          name: investment-cio-copiaultimorob-output
          path: outputs/copiaultimorob_agent_output.json
          if-no-files-found: error
