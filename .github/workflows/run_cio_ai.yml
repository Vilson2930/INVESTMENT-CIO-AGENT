name: Run Investment CIO AI

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run-cio-ai:
    runs-on: ubuntu-latest

    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CIO_GITHUB_TOKEN: ${{ secrets.CIO_GITHUB_TOKEN }}
      CIO_AI_MODEL: nvidia/nemotron-3-super-120b-a12b

    steps:
      # ======================================================
      # 1. REPOSITÓRIO CENTRAL
      # ======================================================

      - name: Checkout Investment CIO Agent
        uses: actions/checkout@v4

      # ======================================================
      # 2. PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # 3. DEPENDÊNCIAS
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install openai
          pip install reportlab

      # ======================================================
      # 4. SEGURANÇA
      # ======================================================

      - name: Validate required secrets
        shell: bash
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "ERRO: NVIDIA_API_KEY não configurada."
            exit 1
          fi

          if [ -z "$CIO_GITHUB_TOKEN" ]; then
            echo "ERRO: CIO_GITHUB_TOKEN não configurado."
            exit 1
          fi

          echo "Secrets obrigatórios encontrados."

      # ======================================================
      # 5. PREPARAR DIRETÓRIOS
      # ======================================================

      - name: Prepare directories
        run: |
          mkdir -p cio_inputs
          mkdir -p cio_ai_output

      # ======================================================
      # 6. LOCALIZAR OS 7 ARTIFACTS MAIS RECENTES
      # ======================================================

      - name: Find latest validated CIO artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ secrets.CIO_GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          central_repo = "Vilson2930/INVESTMENT-CIO-AGENT"
          copia_repo = "Vilson2930/COPIAULTIMOROB"
          token = os.environ["GH_TOKEN"]

          required_artifacts = {
              "sp500": ("investment-cio-sp500-output", central_repo),
              "copia": ("investment-cio-copiaultimorob-output", copia_repo),
              "us_equities": ("investment-cio-us-equities-output", central_repo),
              "b3_equities": ("investment-cio-b3-equities-output", central_repo),
              "ai_infrastructure": ("investment-cio-ai-infrastructure-output", central_repo),
              "fii": ("investment-cio-fii-output", central_repo),
              "growth": ("investment-cio-growth-output", central_repo),
          }

          def list_artifacts(repo):
              url = (
                  f"https://api.github.com/repos/{repo}/"
                  "actions/artifacts?per_page=100"
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )

              with urllib.request.urlopen(request) as response:
                  data = json.load(response)

              return data.get("artifacts", [])

          artifacts_by_repo = {
              central_repo: list_artifacts(central_repo),
              copia_repo: list_artifacts(copia_repo),
          }

          github_output = os.environ["GITHUB_OUTPUT"]

          print("=" * 70)
          print("INVESTMENT CIO AGENT")
          print("LOCALIZAÇÃO DOS 7 ARTIFACTS")
          print("=" * 70)

          with open(
              github_output,
              "a",
              encoding="utf-8",
          ) as output:

              for key, (artifact_name, artifact_repo) in required_artifacts.items():

                  all_artifacts = artifacts_by_repo[artifact_repo]

                  matches = [
                      artifact
                      for artifact in all_artifacts
                      if (
                          artifact.get("name") == artifact_name
                          and not artifact.get("expired", False)
                      )
                  ]

                  if not matches:
                      raise RuntimeError(
                          "Artifact obrigatório não encontrado: "
                          f"{artifact_name}"
                      )

                  matches.sort(
                      key=lambda item: item.get("created_at", ""),
                      reverse=True,
                  )

                  artifact = matches[0]

                  run_id = artifact["workflow_run"]["id"]

                  print()
                  print("Sistema:", key)
                  print("Artifact:", artifact_name)
                  print("Repositório:", artifact_repo)
                  print("Artifact ID:", artifact["id"])
                  print("Run ID:", run_id)
                  print("Criado em:", artifact.get("created_at"))

                  output.write(
                      f"{key}_run_id={run_id}\n"
                  )

          print()
          print("=" * 70)
          print("7 ARTIFACTS LOCALIZADOS COM SUCESSO")
          print("=" * 70)
          PY

      # ======================================================
      # 7. DOWNLOAD — SP500
      # ======================================================

      - name: Download SP500 CIO output
        uses: actions/download-artifact@v5
        with:
          name: investment-cio-sp500-output
          path: cio_inputs/sp500
          repository: Vilson2930/INVESTMENT-CIO-AGENT
          run-id: ${{ steps.artifacts.outputs.sp500_run_id }}
          github-token: ${{ secrets.CIO_GITHUB_TOKEN }}

      # ======================================================
      # 8. DOWNLOAD — COPIAULTIMOROB
      # ======================================================

      - name: Download COPIAULTIMOROB CIO output
        uses: actions/download-artifact@v5
        with:
          name: investment-cio-copiaultimorob-output
          path: cio_inputs/copia
          repository: Vilson2930/COPIAULTIMOROB
          run-id: ${{ steps.artifacts.outputs.copia_run_id }}
          github-token: ${{ secrets.CIO_GITHUB_TOKEN }}

      - name: Adapt COPIAULTIMOROB raw output to universal CIO schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from adapters.copiaultimorob_adapter import (
              build_copiaultimorob_agent_output,
          )

          copia_dir = Path("cio_inputs/copia")

          raw_candidates = list(
              copia_dir.rglob("agent_output_raw.json")
          )

          if len(raw_candidates) != 1:
              raise RuntimeError(
                  "COPIAULTIMOROB: esperado exatamente 1 "
                  f"agent_output_raw.json; encontrados: {len(raw_candidates)}"
              )

          raw_path = raw_candidates[0]

          with raw_path.open("r", encoding="utf-8") as file:
              raw_payload = json.load(file)

          universal_payload = build_copiaultimorob_agent_output(
              raw_payload
          )

          if not isinstance(universal_payload, dict):
              raise RuntimeError(
                  "COPIAULTIMOROB adapter retornou payload inválido."
              )

          if universal_payload.get("system_id") != "global_portfolio":
              raise RuntimeError(
                  "COPIAULTIMOROB adapter retornou system_id inesperado: "
                  f"{universal_payload.get('system_id')}"
              )

          # A validação seguinte exige exatamente um JSON neste diretório.
          # Removemos somente os JSONs baixados do artifact do COPIA.
          for json_path in copia_dir.rglob("*.json"):
              json_path.unlink()

          universal_path = (
              copia_dir / "global_portfolio_agent_output.json"
          )

          with universal_path.open("w", encoding="utf-8") as file:
              json.dump(
                  universal_payload,
                  file,
                  ensure_ascii=False,
                  indent=2,
                  default=str,
              )

          print("COPIAULTIMOROB adaptado para o contrato universal.")
          print("Origem:", raw_path)
          print("Saída:", universal_path)
          print("System ID:", universal_payload.get("system_id"))
          PY

      # ======================================================
      # 9. DOWNLOAD — US EQUITIES
      # ======================================================

      - name: Download US Equities CIO output
        uses: actions/download-artifact@v5
        with:
          name: investment-cio-us-equities-output
          path: cio_inputs/us_equities
          repository: Vilson2930/INVESTMENT-CIO-AGENT
          run-id: ${{ steps.artifacts.outputs.us_equities_run_id }}
          github-token: ${{ secrets.CIO_GITHUB_TOKEN }}

      # ======================================================
      # 10. DOWNLOAD — B3
      # ======================================================

      - name: Download B3 CIO output
        uses: actions/download-artifact@v5
        with:
          name: investment-cio-b3-equities-output
          path: cio_inputs/b3_equities
          repository: Vilson2930/INVESTMENT-CIO-AGENT
          run-id: ${{ steps.artifacts.outputs.b3_equities_run_id }}
          github-token: ${{ secrets.CIO_GITHUB_TOKEN }}

      # ======================================================
      # 11. DOWNLOAD — AI INFRASTRUCTURE
      # ======================================================

      - name: Download AI Infrastructure CIO output
        uses: actions/download-artifact@v5
        with:
          name: investment-cio-ai-infrastructure-output
          path: cio_inputs/ai_infrastructure
          repository: Vilson2930/INVESTMENT-CIO-AGENT
          run-id: ${{ steps.artifacts.outputs.ai_infrastructure_run_id }}
          github-token: ${{ secrets.CIO_GITHUB_TOKEN }}

      # ======================================================
      # 12. DOWNLOAD — FII
      # ======================================================

      - name: Download FII CIO output
        uses: actions/download-artifact@v5
        with:
          name: investment-cio-fii-output
          path: cio_inputs/fii
          repository: Vilson2930/INVESTMENT-CIO-AGENT
          run-id: ${{ steps.artifacts.outputs.fii_run_id }}
          github-token: ${{ secrets.CIO_GITHUB_TOKEN }}

      # ======================================================
      # 13. DOWNLOAD — GROWTH
      # ======================================================

      - name: Download Growth CIO output
        uses: actions/download-artifact@v5
        with:
          name: investment-cio-growth-output
          path: cio_inputs/growth
          repository: Vilson2930/INVESTMENT-CIO-AGENT
          run-id: ${{ steps.artifacts.outputs.growth_run_id }}
          github-token: ${{ secrets.CIO_GITHUB_TOKEN }}

      # ======================================================
      # 14. VALIDAR OS 7 OUTPUTS
      # ======================================================

      - name: Validate seven CIO inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from agents.validator import validate_agent_output

          expected = {
              "sp500_cycle": Path("cio_inputs/sp500"),
              "global_portfolio": Path("cio_inputs/copia"),
              "us_equities": Path("cio_inputs/us_equities"),
              "b3_equities": Path("cio_inputs/b3_equities"),
              "ai_infrastructure": Path("cio_inputs/ai_infrastructure"),
              "fii": Path("cio_inputs/fii"),
              "growth": Path("cio_inputs/growth"),
          }

          print("=" * 70)
          print("VALIDAÇÃO DOS 7 OUTPUTS UNIVERSAIS")
          print("=" * 70)

          found_systems = set()

          for expected_system_id, directory in expected.items():

              files = list(
                  directory.rglob("*.json")
              )

              if len(files) != 1:
                  raise RuntimeError(
                      f"{expected_system_id}: esperado exatamente "
                      f"1 JSON; encontrados: {len(files)}"
                  )

              path = files[0]

              with path.open(
                  "r",
                  encoding="utf-8",
              ) as file:
                  payload = json.load(file)

              validation = validate_agent_output(
                  payload
              )

              if not validation["valid"]:
                  raise RuntimeError(
                      f"{expected_system_id}: output universal inválido: "
                      f"{validation['errors']}"
                  )

              actual_system_id = payload.get(
                  "system_id"
              )

              if actual_system_id != expected_system_id:
                  raise RuntimeError(
                      f"System ID incorreto em {path}: "
                      f"esperado={expected_system_id}, "
                      f"recebido={actual_system_id}"
                  )

              if actual_system_id in found_systems:
                  raise RuntimeError(
                      f"System ID duplicado: {actual_system_id}"
                  )

              found_systems.add(
                  actual_system_id
              )

              print(
                  f"{actual_system_id}: OK -> {path}"
              )

          if found_systems != set(expected):
              raise RuntimeError(
                  "Os sete sistemas oficiais não foram "
                  "carregados corretamente."
              )

          print("=" * 70)
          print("7 OUTPUTS UNIVERSAIS VÁLIDOS")
          print("=" * 70)
          PY

      # ======================================================
      # 15. EXECUTAR CIO INTEGRATION ENGINE V2 + NVIDIA NIM
      # ======================================================

      - name: Run CIO Integration Engine V2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from agents.cio_ai_agent import (
              CIO_AI_VERSION,
              CIO_AI_BUILD,
              DEFAULT_MODEL,
              run_cio_ai,
          )

          print("=" * 70)
          print("INVESTMENT CIO AI")
          print("EXECUÇÃO REAL — FUNCTIONAL INTEGRATION V2 / NVIDIA NIM")
          print("=" * 70)

          system_directories = [
              ("sp500_cycle", Path("cio_inputs/sp500")),
              ("global_portfolio", Path("cio_inputs/copia")),
              ("us_equities", Path("cio_inputs/us_equities")),
              ("b3_equities", Path("cio_inputs/b3_equities")),
              ("ai_infrastructure", Path("cio_inputs/ai_infrastructure")),
              ("fii", Path("cio_inputs/fii")),
              ("growth", Path("cio_inputs/growth")),
          ]

          systems = {}

          for expected_system_id, directory in system_directories:
              files = list(directory.rglob("*.json"))

              if len(files) != 1:
                  raise RuntimeError(
                      f"{expected_system_id}: esperado exatamente 1 JSON; "
                      f"encontrados: {len(files)}"
                  )

              path = files[0]

              with path.open("r", encoding="utf-8") as file:
                  payload = json.load(file)

              actual_system_id = payload.get("system_id")

              if actual_system_id != expected_system_id:
                  raise RuntimeError(
                      f"System ID inesperado em {path}: "
                      f"esperado={expected_system_id}, "
                      f"recebido={actual_system_id}"
                  )

              systems[expected_system_id] = payload
              print(f"Carregado: {expected_system_id}")

          if len(systems) != 7:
              raise RuntimeError(
                  "A execução exige exatamente os sete sistemas."
              )

          # A V2 recebe diretamente os fatos dos sete especialistas.
          # O Orchestrator V1 deixa de participar da conclusão CIO.
          functional_input = {
              "systems": systems,
              "governance": {
                  "broker_execution_allowed": False,
                  "human_decision_required": True,
              },
          }

          print()
          print(f"Executando CIO Integration Engine V{CIO_AI_VERSION}...")
          print("Build:", CIO_AI_BUILD)
          print("Provider: NVIDIA NIM")
          print("Modelo:", DEFAULT_MODEL)
          print("Arquitetura: FUNCTIONAL_INTEGRATION")
          print("Orchestrator V1: NÃO UTILIZADO")

          cio_result = run_cio_ai(functional_input)

          if not isinstance(cio_result, dict):
              raise RuntimeError(
                  "CIO Integration Engine retornou resultado inválido."
              )

          report = cio_result.get("report")

          if not isinstance(report, str) or not report.strip():
              raise RuntimeError(
                  "CIO Integration Engine retornou relatório vazio."
              )

          output_directory = Path("cio_ai_output")
          output_directory.mkdir(parents=True, exist_ok=True)

          cio_json_file = (
              output_directory / "investment_cio_ai_result.json"
          )
          cio_report_file = (
              output_directory / "investment_cio_ai_report.txt"
          )
          integration_input_file = (
              output_directory / "functional_integration_input.json"
          )

          with integration_input_file.open(
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  functional_input,
                  file,
                  ensure_ascii=False,
                  indent=2,
                  default=str,
              )

          with cio_json_file.open(
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  cio_result,
                  file,
                  ensure_ascii=False,
                  indent=2,
                  default=str,
              )

          with cio_report_file.open(
              "w",
              encoding="utf-8",
          ) as file:
              file.write(report)

          print()
          print("=" * 70)
          print("INVESTMENT CIO AI V2 — EXECUÇÃO CONCLUÍDA")
          print("=" * 70)
          print("Versão:", cio_result.get("cio_ai_version", CIO_AI_VERSION))
          print("Build:", cio_result.get("cio_ai_build", CIO_AI_BUILD))
          print("Provider:", cio_result.get("provider"))
          print("Modelo:", cio_result.get("model"))
          print("Arquitetura:", cio_result.get("architecture"))
          print("Sistemas:", cio_result.get("systems_count"))
          print(
              "Structural validation:",
              cio_result.get("structural_validation", {}).get("status"),
          )
          print(
              "Source data changed:",
              cio_result.get("source_data_changed"),
          )
          print()
          print("Input funcional:", integration_input_file)
          print("Resultado CIO AI:", cio_json_file)
          print("Relatório:", cio_report_file)
          print()
          print("Execução em corretora: NÃO")
          print("Decisão final humana: SIM")
          print("=" * 70)
          PY

      # ======================================================
      # 16. GERAR PDF DA EXECUÇÃO ATUAL
      # ======================================================

      - name: Generate CIO PDF report
        run: |
          python - <<'PY'
          from pathlib import Path
          from reportlab.lib import colors
          from reportlab.lib.enums import TA_CENTER
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib.units import cm
          from reportlab.platypus import (
              SimpleDocTemplate, Paragraph, Spacer, PageBreak
          )
          from xml.sax.saxutils import escape
          import re

          report_path = Path("cio_ai_output/investment_cio_ai_report.txt")
          pdf_path = Path("cio_ai_output/investment_cio_ai_report.pdf")

          if not report_path.exists():
              raise RuntimeError(f"Relatório TXT não encontrado: {report_path}")

          report = report_path.read_text(encoding="utf-8").strip()
          if not report:
              raise RuntimeError("Relatório CIO vazio; PDF não será gerado.")

          styles = getSampleStyleSheet()
          title = ParagraphStyle(
              "CIOTitle",
              parent=styles["Title"],
              fontName="Helvetica-Bold",
              fontSize=18,
              leading=22,
              alignment=TA_CENTER,
              spaceAfter=14,
          )
          subtitle = ParagraphStyle(
              "CIOSubtitle",
              parent=styles["Normal"],
              fontName="Helvetica",
              fontSize=9,
              leading=12,
              alignment=TA_CENTER,
              textColor=colors.HexColor("#555555"),
              spaceAfter=18,
          )
          heading = ParagraphStyle(
              "CIOHeading",
              parent=styles["Heading2"],
              fontName="Helvetica-Bold",
              fontSize=12,
              leading=15,
              spaceBefore=10,
              spaceAfter=6,
          )
          body = ParagraphStyle(
              "CIOBody",
              parent=styles["BodyText"],
              fontName="Helvetica",
              fontSize=9.5,
              leading=13,
              spaceAfter=6,
          )
          fact = ParagraphStyle(
              "CIOFact",
              parent=body,
              fontName="Helvetica",
              leftIndent=10,
              firstLineIndent=-5,
          )

          doc = SimpleDocTemplate(
              str(pdf_path),
              pagesize=A4,
              rightMargin=1.7 * cm,
              leftMargin=1.7 * cm,
              topMargin=1.7 * cm,
              bottomMargin=1.7 * cm,
              title="Investment CIO AI - Relatório Integrado",
              author="Investment CIO AI",
          )

          story = [
              Paragraph("INVESTMENT CIO AI", title),
              Paragraph(
                  "Relatório integrado da execução atual dos 7 sistemas oficiais",
                  subtitle,
              ),
          ]

          section_re = re.compile(r"^\d+\.\s+.+")
          for raw in report.splitlines():
              line = raw.strip()
              if not line:
                  story.append(Spacer(1, 5))
                  continue

              safe = escape(line)

              if section_re.match(line) or line == "FATOS DETERMINÍSTICOS — FONTE DE VERDADE":
                  story.append(Paragraph(safe, heading))
              elif line.startswith("- "):
                  story.append(Paragraph("• " + escape(line[2:]), fact))
              else:
                  story.append(Paragraph(safe, body))

          doc.build(story)

          if not pdf_path.exists() or pdf_path.stat().st_size == 0:
              raise RuntimeError("Falha ao gerar o PDF do CIO.")

          print(f"PDF gerado: {pdf_path} ({pdf_path.stat().st_size} bytes)")
          PY

      # ======================================================
      # 17. ENVIAR E-MAIL DA EXECUÇÃO ATUAL
      # ======================================================

      - name: Send CIO report by email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          import html
          from pathlib import Path
          from email.message import EmailMessage
          from email.utils import formatdate

          smtp_user = os.environ.get("SMTP_USER", "").strip()
          smtp_password = os.environ.get("SMTP_PASSWORD", "").replace(" ", "").strip()
          email_to = os.environ.get("EMAIL_TO", "").strip()

          if not smtp_user:
              raise RuntimeError("SMTP_USER não configurado.")
          if not smtp_password:
              raise RuntimeError("SMTP_PASSWORD não configurado.")
          if not email_to:
              raise RuntimeError("EMAIL_TO não configurado.")

          report_path = Path("cio_ai_output/investment_cio_ai_report.txt")
          pdf_path = Path("cio_ai_output/investment_cio_ai_report.pdf")

          if not report_path.exists():
              raise RuntimeError("Relatório TXT da execução atual não encontrado.")
          if not pdf_path.exists():
              raise RuntimeError("PDF da execução atual não encontrado.")

          report = report_path.read_text(encoding="utf-8").strip()
          if not report:
              raise RuntimeError("Relatório CIO vazio; e-mail não será enviado.")

          recipients = [
              item.strip()
              for item in email_to.replace(";", ",").split(",")
              if item.strip()
          ]
          if not recipients:
              raise RuntimeError("EMAIL_TO não contém destinatário válido.")

          msg = EmailMessage()
          msg["Subject"] = "Investment CIO AI V2.4.1 - Relatório Integrado"
          msg["From"] = smtp_user
          msg["To"] = ", ".join(recipients)
          msg["Date"] = formatdate(localtime=True)

          msg.set_content(
              "INVESTMENT CIO AI V2.4.1\n\n"
              + report
              + "\n\nPDF completo desta mesma execução em anexo.\n"
              + "Execução em corretora: NÃO\n"
              + "Decisão final humana: SIM\n"
          )

          html_report = html.escape(report).replace("\n", "<br>\n")
          msg.add_alternative(
              f"""\
              <html>
                <body style="font-family:Arial,sans-serif;line-height:1.5;color:#222;">
                  <h2>Investment CIO AI V2.4.1</h2>
                  <p><strong>Relatório integrado dos 7 sistemas - execução atual</strong></p>
                  <div style="padding:16px;border:1px solid #ddd;border-radius:8px;">
                    {html_report}
                  </div>
                  <p style="margin-top:18px;">
                    <strong>PDF completo desta mesma execução em anexo.</strong><br>
                    Execução em corretora: NÃO<br>
                    Decisão final humana: SIM
                  </p>
                </body>
              </html>
              """,
              subtype="html",
          )

          msg.add_attachment(
              pdf_path.read_bytes(),
              maintype="application",
              subtype="pdf",
              filename="investment_cio_ai_report.pdf",
          )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465, timeout=30) as smtp:
              smtp.login(smtp_user, smtp_password)
              smtp.send_message(msg)

          print("E-mail CIO enviado com sucesso.")
          print("Anexo:", pdf_path)
          PY

      # ======================================================
      # 18. PUBLICAR RESULTADO FINAL
      # ======================================================

      - name: Upload Investment CIO AI result
        uses: actions/upload-artifact@v4
        with:
          name: investment-cio-ai-result
          path: cio_ai_output/
          if-no-files-found: error
          retention-days: 30
