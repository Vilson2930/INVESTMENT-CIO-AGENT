name: Collect US Equities

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  collect-us-equities:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # CHECKOUT — INVESTMENT CIO AGENT
      # ======================================================

      - name: Checkout Investment CIO Agent
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # DEPENDÊNCIAS
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # DIRETÓRIOS
      # ======================================================

      - name: Prepare directories
        run: |
          mkdir -p source-us-equities
          mkdir -p outputs

      # ======================================================
      # LOCALIZAR ÚLTIMO ARTIFACT DAS AÇÕES AMERICANAS
      # ======================================================

      - name: Find latest US Equities artifact
        id: us_equities
        env:
          GH_TOKEN: ${{ secrets.CIO_GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = "Vilson2930/portifolio-a-oes-americana-teste"
          artifact_name = "portfolio-acoes-americana-agent-output"

          token = os.environ["GH_TOKEN"]

          url = (
              f"https://api.github.com/repos/{repo}/"
              "actions/artifacts?per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          artifacts = [
              artifact
              for artifact in data.get("artifacts", [])
              if (
                  artifact.get("name") == artifact_name
                  and not artifact.get("expired", False)
              )
          ]

          if not artifacts:
              raise RuntimeError(
                  "Nenhum artifact válido das Ações Americanas "
                  f"encontrado com o nome '{artifact_name}'."
              )

          artifacts.sort(
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )

          artifact = artifacts[0]

          run_id = artifact["workflow_run"]["id"]

          print("=" * 70)
          print("ARTIFACT US EQUITIES ENCONTRADO")
          print("=" * 70)
          print("Repositório:", repo)
          print("Nome:", artifact["name"])
          print("ID:", artifact["id"])
          print("Run ID:", run_id)
          print("Criado em:", artifact.get("created_at"))
          print("=" * 70)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"run_id={run_id}\n")
          PY

      # ======================================================
      # BAIXAR ARTIFACT
      # ======================================================

      - name: Download US Equities artifact
        uses: actions/download-artifact@v5
        with:
          name: portfolio-acoes-americana-agent-output
          path: source-us-equities
          repository: Vilson2930/portifolio-a-oes-americana-teste
          run-id: ${{ steps.us_equities.outputs.run_id }}
          github-token: ${{ secrets.CIO_GITHUB_TOKEN }}

      # ======================================================
      # LOCALIZAR agent_output_raw.json
      # ======================================================

      - name: Locate US Equities raw output
        id: raw
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          files = list(
              Path("source-us-equities").rglob(
                  "agent_output_raw.json"
              )
          )

          if len(files) != 1:
              raise RuntimeError(
                  "Esperado exatamente 1 agent_output_raw.json "
                  f"das Ações Americanas; encontrados: {len(files)}"
              )

          raw_file = files[0]

          print(
              "US Equities raw output encontrado:",
              raw_file,
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"raw_file={raw_file.as_posix()}\n"
              )
          PY

      # ======================================================
      # PROCESSAR PELO CIO COLLECTOR
      # ======================================================

      - name: Process US Equities through CIO Collector
        env:
          RAW_FILE: ${{ steps.raw.outputs.raw_file }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from agents.collector import collect_file

          raw_file = os.environ["RAW_FILE"]

          result = collect_file(raw_file)

          output_file = Path(
              "outputs/us_equities_agent_output.json"
          )

          output_file.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          with output_file.open(
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  result,
                  file,
                  ensure_ascii=False,
                  indent=2,
                  allow_nan=False,
              )

          print("=" * 70)
          print("INVESTMENT CIO AGENT")
          print("COLETA REAL — US EQUITIES")
          print("=" * 70)

          print(
              "System ID:",
              result.get("system_id"),
          )

          print(
              "Sistema:",
              result.get("system_name"),
          )

          print(
              "Status:",
              result.get("status"),
          )

          print(
              "Sinal:",
              result.get(
                  "decision",
                  {},
              ).get("signal"),
          )

          print(
              "Posições:",
              len(
                  result.get(
                      "positions",
                      [],
                  )
              ),
          )

          print(
              "Oportunidades:",
              len(
                  result.get(
                      "opportunities",
                      [],
                  )
              ),
          )

          print(
              "Output universal:",
              output_file,
          )

          print("=" * 70)
          PY

      # ======================================================
      # VALIDAR OUTPUT UNIVERSAL
      # ======================================================

      - name: Validate universal US Equities output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from agents.validator import validate_agent_output

          output_file = Path(
              "outputs/us_equities_agent_output.json"
          )

          with output_file.open(
              "r",
              encoding="utf-8",
          ) as file:
              output = json.load(file)

          validation = validate_agent_output(output)

          if not validation["valid"]:
              print(
                  json.dumps(
                      validation,
                      ensure_ascii=False,
                      indent=2,
                  )
              )

              raise RuntimeError(
                  "Output universal das Ações Americanas "
                  "não passou pelo schema."
              )

          if output.get("system_id") != "us_equities":
              raise RuntimeError(
                  "system_id inesperado: "
                  f"{output.get('system_id')}"
              )

          positions = output.get(
              "positions",
              [],
          )

          opportunities = output.get(
              "opportunities",
              [],
          )

          if not positions:
              raise RuntimeError(
                  "US Equities não possui posições."
              )

          if len(opportunities) != len(positions):
              raise RuntimeError(
                  "Quantidade de oportunidades diferente "
                  "da quantidade de posições."
              )

          audit = output.get(
              "audit",
              {},
          )

          if audit.get(
              "source_signals_preserved"
          ) is not True:
              raise RuntimeError(
                  "Os sinais de origem não foram "
                  "marcados como preservados."
              )

          if audit.get(
              "adapter_recalculated_signals"
          ) is not False:
              raise RuntimeError(
                  "O adapter não pode recalcular sinais."
              )

          print("=" * 70)
          print(
              "US EQUITIES VALIDADO COM SUCESSO"
          )
          print("=" * 70)

          print(
              "System ID:",
              output["system_id"],
          )

          print(
              "Status:",
              output["status"],
          )

          print(
              "Posições:",
              len(positions),
          )

          print(
              "Sinais preservados: SIM"
          )

          print(
              "Recálculo pelo CIO: NÃO"
          )

          print("=" * 70)
          PY

      # ======================================================
      # PUBLICAR OUTPUT UNIVERSAL
      # ======================================================

      - name: Upload Investment CIO US Equities output
        uses: actions/upload-artifact@v4
        with:
          name: investment-cio-us-equities-output
          path: outputs/us_equities_agent_output.json
          if-no-files-found: error
          retention-days: 30
