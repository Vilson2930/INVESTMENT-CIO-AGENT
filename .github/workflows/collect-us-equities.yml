name: Collect US Equities

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # CHECKOUT — INVESTMENT CIO AGENT
      # ======================================================

      - name: Checkout Investment CIO Agent
        uses: actions/checkout@v4

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ======================================================
      # DEPENDÊNCIAS
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ======================================================
      # DIRETÓRIOS DE TRABALHO
      # ======================================================

      - name: Prepare directories
        run: |
          mkdir -p downloaded_us_equities
          mkdir -p outputs

      # ======================================================
      # LOCALIZAR ÚLTIMO ARTIFACT DO ROBÔ
      # ======================================================

      - name: Find latest US Equities artifact
        env:
          GH_TOKEN: ${{ secrets.CIO_GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          owner = "Vilson2930"
          repo = "portifolio-a-oes-americana-teste"
          artifact_name = "portfolio-acoes-americana-agent-output"

          token = os.environ["GH_TOKEN"]

          url = (
              f"https://api.github.com/repos/"
              f"{owner}/{repo}/actions/artifacts"
              f"?per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          artifacts = [
              artifact
              for artifact in payload.get("artifacts", [])
              if artifact.get("name") == artifact_name
              and not artifact.get("expired", False)
          ]

          if not artifacts:
              raise RuntimeError(
                  "Nenhum artifact válido encontrado com o nome: "
                  + artifact_name
              )

          artifacts.sort(
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )

          latest = artifacts[0]
          artifact_id = latest["id"]

          print("=" * 70)
          print("ARTIFACT US EQUITIES ENCONTRADO")
          print("=" * 70)
          print("Repositório:", repo)
          print("Nome:", latest.get("name"))
          print("ID:", artifact_id)
          print("Criado em:", latest.get("created_at"))
          print("=" * 70)

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8",
          ) as env_file:
              env_file.write(
                  f"US_EQUITIES_ARTIFACT_ID={artifact_id}\n"
              )
          PY

      # ======================================================
      # BAIXAR ARTIFACT
      # ======================================================

      - name: Download US Equities artifact
        env:
          GH_TOKEN: ${{ secrets.CIO_GITHUB_TOKEN }}
        run: |
          echo "Baixando artifact ID: $US_EQUITIES_ARTIFACT_ID"

          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/Vilson2930/portifolio-a-oes-americana-teste/actions/artifacts/${US_EQUITIES_ARTIFACT_ID}/zip" \
            > downloaded_us_equities/artifact.zip

          test -s downloaded_us_equities/artifact.zip

          echo "Artifact baixado com sucesso:"
          ls -lh downloaded_us_equities/artifact.zip

      # ======================================================
      # EXTRAIR ARTIFACT
      # ======================================================

      - name: Extract US Equities artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          zip_path = Path(
              "downloaded_us_equities/artifact.zip"
          )

          extract_dir = Path(
              "downloaded_us_equities/extracted"
          )

          extract_dir.mkdir(
              parents=True,
              exist_ok=True,
          )

          with ZipFile(zip_path, "r") as archive:
              archive.extractall(extract_dir)

          print("Arquivos extraídos:")

          for path in extract_dir.rglob("*"):
              if path.is_file():
                  print("-", path)
          PY

      # ======================================================
      # LOCALIZAR agent_output_raw.json
      # ======================================================

      - name: Locate raw agent output
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          base = Path(
              "downloaded_us_equities/extracted"
          )

          matches = list(
              base.rglob("agent_output_raw.json")
          )

          if not matches:
              raise FileNotFoundError(
                  "agent_output_raw.json não encontrado "
                  "dentro do artifact."
              )

          raw_file = matches[0]

          print(
              "JSON RAW encontrado:",
              raw_file,
          )

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8",
          ) as env_file:
              env_file.write(
                  f"US_EQUITIES_RAW_FILE={raw_file}\n"
              )
          PY

      # ======================================================
      # PROCESSAR PELO COLLECTOR
      # ======================================================

      - name: Process real US Equities output
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from agents.collector import collect_file

          raw_file = os.environ[
              "US_EQUITIES_RAW_FILE"
          ]

          output = collect_file(
              raw_file
          )

          output_path = Path(
              "outputs/us_equities_agent_output.json"
          )

          output_path.parent.mkdir(
              parents=True,
              exist_ok=True,
          )

          with open(
              output_path,
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  output,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )

          print("=" * 70)
          print("INVESTMENT CIO AGENT")
          print("COLETA REAL — US EQUITIES")
          print("=" * 70)

          print(
              "Sistema:",
              output.get("system_name"),
          )

          print(
              "Status:",
              output.get("status"),
          )

          decision = output.get(
              "decision",
              {},
          )

          print(
              "Sinal:",
              decision.get("signal"),
          )

          metrics = output.get(
              "metrics",
              {},
          )

          print(
              "Ações:",
              metrics.get("portfolio_size"),
          )

          print(
              "Setores:",
              metrics.get("number_of_sectors"),
          )

          print(
              "Entrada Forte:",
              metrics.get("entry_strong"),
          )

          print(
              "Entrada:",
              metrics.get("entry"),
          )

          print(
              "Aguardar:",
              metrics.get("wait"),
          )

          print(
              "Não comprar agora:",
              metrics.get("do_not_buy_now"),
          )

          print(
              "Output universal criado:",
              output_path,
          )

          print("=" * 70)
          PY

      # ======================================================
      # VALIDAR OUTPUT UNIVERSAL
      # ======================================================

      - name: Validate universal output
        run: |
          python - <<'PY'
          import json

          from agents.validator import (
              validate_agent_output,
          )

          path = (
              "outputs/"
              "us_equities_agent_output.json"
          )

          with open(
              path,
              "r",
              encoding="utf-8",
          ) as file:
              output = json.load(file)

          validation = validate_agent_output(
              output
          )

          if not validation["valid"]:

              print(
                  "ERROS DE VALIDAÇÃO:"
              )

              for error in validation[
                  "errors"
              ]:
                  print(error)

              raise RuntimeError(
                  "Output US Equities "
                  "não passou pelo schema universal."
              )

          print("=" * 70)
          print(
              "OUTPUT US EQUITIES "
              "VALIDADO COM SUCESSO"
          )
          print("=" * 70)
          PY

      # ======================================================
      # UPLOAD DO OUTPUT DO INVESTMENT CIO
      # ======================================================

      - name: Upload Investment CIO US Equities output
        uses: actions/upload-artifact@v4
        with:
          name: investment-cio-us-equities-output
          path: outputs/us_equities_agent_output.json
          if-no-files-found: error
          retention-days: 30
