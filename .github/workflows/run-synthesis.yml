name: Run CIO Synthesis

on:
  workflow_dispatch:

jobs:

  synthesis:

    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout Investment CIO Agent
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # DEPENDÊNCIAS
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ======================================================
      # LOCALIZAR ARTIFACT DO SP500
      # ======================================================

      - name: Find latest SP500 CIO artifact
        id: find_sp500
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          artifact_name = (
              "investment-cio-sp500-output"
          )

          url = (
              f"https://api.github.com/repos/{repo}/"
              "actions/artifacts?per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(
              request
          ) as response:
              data = json.load(response)

          artifacts = [
              artifact
              for artifact in data.get(
                  "artifacts",
                  []
              )
              if (
                  artifact.get("name")
                  == artifact_name
                  and not artifact.get(
                      "expired",
                      False
                  )
              )
          ]

          if not artifacts:
              raise RuntimeError(
                  "Artifact do SP500 não encontrado: "
                  + artifact_name
              )

          artifacts.sort(
              key=lambda item: item["created_at"],
              reverse=True,
          )

          artifact = artifacts[0]

          print("SP500 artifact:")
          print("Nome:", artifact["name"])
          print("ID:", artifact["id"])
          print(
              "Criado em:",
              artifact["created_at"]
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"artifact_id={artifact['id']}\n"
              )
          PY


      # ======================================================
      # LOCALIZAR ARTIFACT DO COPIAULTIMOROB
      # ======================================================

      - name: Find latest COPIAULTIMOROB CIO artifact
        id: find_copia
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          artifact_name = (
              "investment-cio-copiaultimorob-output"
          )

          url = (
              f"https://api.github.com/repos/{repo}/"
              "actions/artifacts?per_page=100"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(
              request
          ) as response:
              data = json.load(response)

          artifacts = [
              artifact
              for artifact in data.get(
                  "artifacts",
                  []
              )
              if (
                  artifact.get("name")
                  == artifact_name
                  and not artifact.get(
                      "expired",
                      False
                  )
              )
          ]

          if not artifacts:
              raise RuntimeError(
                  "Artifact do COPIAULTIMOROB "
                  "não encontrado: "
                  + artifact_name
              )

          artifacts.sort(
              key=lambda item: item["created_at"],
              reverse=True,
          )

          artifact = artifacts[0]

          print("COPIAULTIMOROB artifact:")
          print("Nome:", artifact["name"])
          print("ID:", artifact["id"])
          print(
              "Criado em:",
              artifact["created_at"]
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"artifact_id={artifact['id']}\n"
              )
          PY


      # ======================================================
      # DOWNLOAD DO SP500
      # ======================================================

      - name: Download SP500 CIO artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.find_sp500.outputs.artifact_id }}
        run: |
          mkdir -p collected/sp500

          curl -L \
            --fail \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o collected/sp500/artifact.zip

          unzip -o \
            collected/sp500/artifact.zip \
            -d collected/sp500/extracted


      # ======================================================
      # DOWNLOAD DO COPIAULTIMOROB
      # ======================================================

      - name: Download COPIAULTIMOROB CIO artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.find_copia.outputs.artifact_id }}
        run: |
          mkdir -p collected/copiaultimorob

          curl -L \
            --fail \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o collected/copiaultimorob/artifact.zip

          unzip -o \
            collected/copiaultimorob/artifact.zip \
            -d collected/copiaultimorob/extracted


      # ======================================================
      # LOCALIZAR OS DOIS JSONs
      # ======================================================

      - name: Locate universal CIO outputs
        id: locate_outputs
        run: |
          SP500_FILE=$(find \
            collected/sp500/extracted \
            -type f \
            -name "sp500_cycle_agent_output.json" \
            | head -n 1)

          COPIA_FILE=$(find \
            collected/copiaultimorob/extracted \
            -type f \
            -name "copiaultimorob_agent_output.json" \
            | head -n 1)

          if [ -z "$SP500_FILE" ]; then
            echo "SP500 output não encontrado."
            echo "Arquivos disponíveis:"
            find collected/sp500/extracted -type f
            exit 1
          fi

          if [ -z "$COPIA_FILE" ]; then
            echo "COPIAULTIMOROB output não encontrado."
            echo "Arquivos disponíveis:"
            find collected/copiaultimorob/extracted -type f
            exit 1
          fi

          echo "SP500:"
          echo "$SP500_FILE"

          echo "COPIAULTIMOROB:"
          echo "$COPIA_FILE"

          echo "sp500_file=$SP500_FILE" \
            >> "$GITHUB_OUTPUT"

          echo "copia_file=$COPIA_FILE" \
            >> "$GITHUB_OUTPUT"


      # ======================================================
      # EXECUTAR SYNTHESIS AGENT
      # ======================================================

      - name: Run CIO Synthesis Agent
        env:
          SP500_FILE: ${{ steps.locate_outputs.outputs.sp500_file }}
          COPIA_FILE: ${{ steps.locate_outputs.outputs.copia_file }}
        run: |
          mkdir -p outputs

          python - <<'PY'
          import json
          import os

          from agents.synthesis_agent import (
              build_synthesis,
          )

          sp500_file = os.environ[
              "SP500_FILE"
          ]

          copia_file = os.environ[
              "COPIA_FILE"
          ]

          with open(
              sp500_file,
              "r",
              encoding="utf-8",
          ) as file:
              sp500_output = json.load(file)

          with open(
              copia_file,
              "r",
              encoding="utf-8",
          ) as file:
              copia_output = json.load(file)

          synthesis = build_synthesis(
              sp500_output,
              copia_output,
          )

          output_file = (
              "outputs/cio_synthesis.json"
          )

          with open(
              output_file,
              "w",
              encoding="utf-8",
          ) as file:
              json.dump(
                  synthesis,
                  file,
                  ensure_ascii=False,
                  indent=2,
              )

          print("=" * 70)
          print("INVESTMENT CIO AGENT")
          print("REAL MULTI-SYSTEM SYNTHESIS")
          print("=" * 70)

          print("Status:")
          print(
              synthesis["status"]
          )

          print()

          print("SP500 Cycle Atlas:")
          print(
              "Signal:",
              synthesis[
                  "source_decisions"
              ][
                  "SP500_CYCLE_ATLAS"
              ][
                  "signal"
              ]
          )

          print(
              "Stance:",
              synthesis[
                  "comparison"
              ][
                  "sp500_stance"
              ]
          )

          print()

          print("COPIAULTIMOROB:")
          print(
              "Signal:",
              synthesis[
                  "source_decisions"
              ][
                  "COPIAULTIMOROB"
              ][
                  "signal"
              ]
          )

          print(
              "Stance:",
              synthesis[
                  "comparison"
              ][
                  "global_stance"
              ]
          )

          print()

          print("Relação entre sistemas:")
          print(
              synthesis[
                  "comparison"
              ][
                  "relationship"
              ]
          )

          print()

          print("Interpretação:")
          print(
              synthesis[
                  "comparison"
              ][
                  "interpretation"
              ]
          )

          print()

          print("Kill Switch global:")
          print(
              synthesis[
                  "risk"
              ][
                  "global_kill_switch"
              ]
          )

          print()

          print("Alertas consolidados:")

          alerts = synthesis[
              "risk"
          ][
              "alerts"
          ]

          if alerts:
              for alert in alerts:
                  print(
                      "-",
                      alert
                  )
          else:
              print(
                  "Nenhum alerta consolidado."
              )

          print()

          print(
              "Arquivo criado:",
              output_file
          )

          print("=" * 70)
          print(
              "SÍNTESE REAL CONCLUÍDA "
              "COM SUCESSO"
          )
          print("=" * 70)
          PY


      # ======================================================
      # VERIFICAÇÃO FINAL
      # ======================================================

      - name: Verify synthesis output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "outputs/cio_synthesis.json"
          )

          if not path.exists():
              raise RuntimeError(
                  "cio_synthesis.json "
                  "não foi criado."
              )

          with open(
              path,
              "r",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          required = [
              "synthesis_version",
              "generated_at",
              "status",
              "systems_analyzed",
              "source_decisions",
              "comparison",
              "risk",
              "audit",
              "policy",
          ]

          missing = [
              field
              for field in required
              if field not in data
          ]

          if missing:
              raise RuntimeError(
                  "Campos ausentes na síntese: "
                  + ", ".join(missing)
              )

          if (
              data["policy"].get(
                  "source_decisions_overridden"
              )
              is not False
          ):
              raise RuntimeError(
                  "Política de preservação "
                  "das decisões violada."
              )

          if (
              data["policy"].get(
                  "broker_execution_allowed"
              )
              is not False
          ):
              raise RuntimeError(
                  "Execução em corretora "
                  "não pode estar habilitada."
              )

          print(
              "cio_synthesis.json "
              "verificado com sucesso."
          )
          PY


      # ======================================================
      # PUBLICAR RESULTADO
      # ======================================================

      - name: Upload CIO Synthesis
        uses: actions/upload-artifact@v4
        with:
          name: investment-cio-synthesis
          path: outputs/cio_synthesis.json
          if-no-files-found: error
